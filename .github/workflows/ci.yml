name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # Verifica las migraciones contra Supabase real (el resto de pruebas RLS corren en PGlite dentro de `npm test`).
  # OJO: este job no se ha ejecutado todavia (no hay Docker en el equipo de desarrollo); revisarlo en el primer PR.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint --level error
